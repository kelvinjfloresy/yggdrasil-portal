<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="emblemGlow_athena_light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#FAF5FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#emblemGlow_athena_light)"/>
  <rect x="15" y="15" width="470" height="470" rx="24" fill="none" stroke="#A855F7" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>
  <g transform="translate(250, 250) scale(1.15) translate(-256, -230)">
    
    <!-- Glifo ATHENA: El Búho Epistémico de la Sabiduría & Escudo Aegis de Conservación Física -->
    
    <!-- 1. Halo de Calibración Epistémica & Órbita Cuántica de Tensión Tensorial -->
    <circle cx="256" cy="230" r="92" fill="none" stroke="#A855F7" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3"/>
    <circle cx="256" cy="230" r="74" fill="none" stroke="#E9D5FF" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.45"/>
    <circle cx="256" cy="230" r="52" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="2 4" opacity="0.25"/>

    <!-- 2. Escudo Aegis Exterior (Filtro de Fuego Epistémico & Conservación de Energía) -->
    <path d="M 216,148 L 256,134 L 296,148 L 332,192 L 322,268 L 256,326 L 190,268 L 180,192 Z"
          fill="#A855F7" fill-opacity="0.08" stroke="#A855F7" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Ribete Interior del Escudo Aegis -->
    <path d="M 222,156 L 256,144 L 290,156 L 322,196 L 314,260 L 256,312 L 198,260 L 190,196 Z"
          fill="none" stroke="#E9D5FF" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.5"/>

    <!-- 3. Estrella Apex de la Verdad Científica (Apex Zenith 000°) -->
    <g transform="translate(256, 126)">
      <polygon points="0,-15 3.5,-4 15,0 3.5,4 0,15 -3.5,4 -15,0 -3.5,-4" fill="#A855F7"/>
      <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2" fill="#E9D5FF"/>
    </g>
    <line x1="256" y1="140" x2="256" y2="168" stroke="#E9D5FF" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

    <!-- 4. Corona de Atenea / Ceño Geométrico del Búho Epistémico -->
    <path d="M 206,178 L 236,192 L 256,170 L 276,192 L 306,178 L 286,204 L 256,208 L 226,204 Z"
          fill="#A855F7" fill-opacity="0.35" stroke="#A855F7" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="256,172 268,190 256,206 244,190" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="256" cy="190" r="3" fill="#A855F7"/>

    <!-- 5. Ojos Biónicos de Observación Epistémica (Omniscient Lens / Fourier Tensors) -->
    <!-- Ojo Izquierdo -->
    <g transform="translate(230, 218)">
      <circle cx="0" cy="0" r="19" fill="#0B121F" stroke="#A855F7" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#E9D5FF" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="8" fill="#A855F7" fill-opacity="0.4"/>
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
      <!-- Retícula de calibración -->
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#E9D5FF" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#E9D5FF" stroke-width="1" opacity="0.6"/>
      <circle cx="0" cy="0" r="2" fill="#A855F7"/>
    </g>

    <!-- Ojo Derecho -->
    <g transform="translate(282, 218)">
      <circle cx="0" cy="0" r="19" fill="#0B121F" stroke="#A855F7" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#E9D5FF" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="8" fill="#A855F7" fill-opacity="0.4"/>
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
      <!-- Retícula de calibración -->
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#E9D5FF" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#E9D5FF" stroke-width="1" opacity="0.6"/>
      <circle cx="0" cy="0" r="2" fill="#A855F7"/>
    </g>

    <!-- 6. Pico Epistémico / Triángulo de Proporción Áurea -->
    <polygon points="250,222 262,222 256,242" fill="#A855F7" stroke="#E9D5FF" stroke-width="1.5"/>
    <circle cx="256" cy="230" r="2" fill="#FFFFFF"/>

    <!-- 7. Red Neuronal Informada por la Física (PINN / FNO Tensor Lattice) -->
    <!-- Nodos del Ala Izquierda -->
    <line x1="230" y1="237" x2="208" y2="260" stroke="#A855F7" stroke-width="1.8" opacity="0.8"/>
    <line x1="208" y1="260" x2="194" y2="284" stroke="#E9D5FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="208" y1="260" x2="232" y2="282" stroke="#A855F7" stroke-width="1.5" opacity="0.6"/>
    <line x1="232" y1="282" x2="256" y2="272" stroke="#E9D5FF" stroke-width="1.8" opacity="0.8"/>
    
    <circle cx="208" cy="260" r="4.5" fill="#A855F7"/>
    <circle cx="208" cy="260" r="2" fill="#FFFFFF"/>
    <circle cx="194" cy="284" r="3.5" fill="#E9D5FF"/>
    <circle cx="232" cy="282" r="4" fill="#A855F7"/>

    <!-- Nodos del Ala Derecha -->
    <line x1="282" y1="237" x2="304" y2="260" stroke="#A855F7" stroke-width="1.8" opacity="0.8"/>
    <line x1="304" y1="260" x2="318" y2="284" stroke="#E9D5FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="304" y1="260" x2="280" y2="282" stroke="#A855F7" stroke-width="1.5" opacity="0.6"/>
    <line x1="280" y1="282" x2="256" y2="272" stroke="#E9D5FF" stroke-width="1.8" opacity="0.8"/>

    <circle cx="304" cy="260" r="4.5" fill="#A855F7"/>
    <circle cx="304" cy="260" r="2" fill="#FFFFFF"/>
    <circle cx="318" cy="284" r="3.5" fill="#E9D5FF"/>
    <circle cx="280" cy="282" r="4" fill="#A855F7"/>

    <!-- 8. Núcleo Cuántico Central: El Tribunal de la Física (Singularidad Inviolable) -->
    <polygon points="256,252 270,272 256,292 242,272" fill="#A855F7" fill-opacity="0.35" stroke="#A855F7" stroke-width="2"/>
    <polygon points="256,258 265,272 256,286 247,272" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="256" cy="272" r="3.5" fill="#A855F7"/>

    <!-- 9. Quilla y Terminal de Cierre de Conservación (Eje y Plomada Epistémica) -->
    <path d="M 246,296 L 256,312 L 266,296 Z" fill="#A855F7"/>
    <circle cx="256" cy="314" r="3" fill="#E9D5FF"/>
    <line x1="236" y1="322" x2="276" y2="322" stroke="#E9D5FF" stroke-width="2.5" stroke-linecap="round"/>
    
  </g>
</svg>