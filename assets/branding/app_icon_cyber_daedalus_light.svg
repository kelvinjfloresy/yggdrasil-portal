<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <radialGradient id="cardGlow_cyber_daedalus_light" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#FAFCFA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="borderGrad_cyber_daedalus_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#cardGlow_cyber_daedalus_light)" stroke="url(#borderGrad_cyber_daedalus_light)" stroke-width="3"/>
  <circle cx="256" cy="230" r="120" fill="none" stroke="#0066FF" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.35"/>

  
        <!-- Símbolo Daedalus: Edificio Inteligente BACS & Gemelo Digital 3D (ISO 52120-1) -->
        <!-- Estructura arquitectónica del edificio inteligente -->
        <path d="M 216,315 L 216,180 L 256,138 L 296,180 L 296,315 Z" fill="none" stroke="#0066FF" stroke-width="4.5" stroke-linejoin="round"/>
        <!-- Niveles de automatización BACS (Plantas del edificio) -->
        <line x1="216" y1="215" x2="296" y2="215" stroke="#0066FF" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.6"/>
        <line x1="216" y1="250" x2="296" y2="250" stroke="#0066FF" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.6"/>
        <line x1="216" y1="285" x2="296" y2="285" stroke="#0066FF" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.6"/>
        <!-- Núcleo central del gemelo digital / conducto IoT -->
        <rect x="242" y="215" width="28" height="100" fill="#0066FF" opacity="0.25"/>
        <line x1="256" y1="138" x2="256" y2="315" stroke="#66A3FF" stroke-width="3"/>
        <!-- Aguja / Antena BACnet en la cúspide con halo IoT -->
        <line x1="256" y1="138" x2="256" y2="108" stroke="#66A3FF" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="256" cy="102" r="7" fill="#0066FF"/>
        <circle cx="256" cy="102" r="3" fill="#FFFFFF"/>
        <circle cx="256" cy="102" r="16" fill="none" stroke="#66A3FF" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
        <!-- Nodos sensores BACS en cada planta -->
        <circle cx="236" y="195" r="4.5" fill="#66A3FF"/>
        <circle cx="276" y="195" r="4.5" fill="#66A3FF"/>
        <circle cx="236" y="265" r="4.5" fill="#66A3FF"/>
        <circle cx="276" y="265" r="4.5" fill="#66A3FF"/>
        

  <!-- Tipografía Suiza & Endoso Yggdrasil -->
  <g text-anchor="middle">
    <text x="256" y="85" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#475569" letter-spacing="4">YGGDRASIL COMPUTING</text>
    <text x="256" y="388" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="2">CYBER-CORE</text>
    <text x="256" y="415" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0066FF" letter-spacing="4">DAEDALUS</text>
    <text x="256" y="442" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748B" letter-spacing="2">KERNEL ANGLE · 315°W</text>
  </g>
</svg>